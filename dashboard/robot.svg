<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7FEE7"/>
    </linearGradient>
    <linearGradient id="pagdiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4D7C0F"/>
      <stop offset="50%" stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 45%, 55%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.1); }
    }
    @keyframes orbPulse {
      0%, 100% { fill: #84CC16; filter: drop-shadow(0 0 2px #84CC16); }
      50% { fill: #A3E635; filter: drop-shadow(0 0 8px #A3E635); }
    }
    .robo-eye {
      transform-origin: center;
      animation: blink 4s infinite ease-in-out;
    }
    .antenna-orb {
      animation: orbPulse 2s infinite ease-in-out;
    }
  </style>

  <!-- Antenna Stem -->
  <line x1="120" y1="50" x2="120" y2="24" stroke="#84CC16" stroke-width="5" stroke-linecap="round"/>
  <!-- Antenna Glowing Orb -->
  <circle class="antenna-orb" cx="120" cy="18" r="10" fill="#84CC16"/>

  <!-- Ears / Audio Bolts -->
  <rect x="36" y="112" width="12" height="36" rx="6" fill="#84CC16"/>
  <rect x="192" y="112" width="12" height="36" rx="6" fill="#84CC16"/>

  <!-- Robot Head Frame -->
  <rect x="44" y="60" width="152" height="136" rx="32" fill="url(#headGrad)" stroke="#84CC16" stroke-width="4.5"/>

  <!-- Indian Pagdi / Turban Accent -->
  <path d="M 40 76 Q 120 44 200 76 L 194 62 Q 120 32 46 62 Z" fill="url(#pagdiGrad)"/>
  <rect x="42" y="66" width="156" height="18" rx="9" fill="url(#pagdiGrad)"/>
  <!-- Pagdi Royal Golden Gem -->
  <circle cx="120" cy="74" r="8" fill="#F59E0B" stroke="#FEF3C7" stroke-width="2"/>
  <circle cx="120" cy="74" r="4" fill="#D97706"/>

  <!-- Digital Visor Screen -->
  <rect x="62" y="98" width="116" height="66" rx="18" fill="#0F172A"/>

  <!-- Friendly Cyan Glowing Eyes with Blink Animation -->
  <g class="robo-eye">
    <!-- Left Eye -->
    <rect x="78" y="116" width="22" height="18" rx="6" fill="#38BDF8" filter="url(#glowGreen)"/>
    <circle cx="84" cy="122" r="3" fill="#FFFFFF"/>
    <!-- Right Eye -->
    <rect x="140" y="116" width="22" height="18" rx="6" fill="#38BDF8" filter="url(#glowGreen)"/>
    <circle cx="146" cy="122" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Friendly Curved Smile -->
  <path d="M 94 148 Q 120 162 146 148" stroke="#84CC16" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Namaste / AI ROBO Chest Badge -->
  <rect x="88" y="202" width="64" height="24" rx="12" fill="#84CC16"/>
  <text x="120" y="218" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="1">AI ROBO</text>
</svg>
