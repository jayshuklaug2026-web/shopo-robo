<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)"/>
  <!-- Robot Face -->
  <g fill="#FFFFFF" transform="translate(106, 106)">
    <!-- Antenna -->
    <rect x="140" y="20" width="20" height="40" rx="10"/>
    <circle cx="150" cy="15" r="15"/>
    <!-- Head Box -->
    <rect x="30" y="60" width="240" height="190" rx="40"/>
    <!-- Screen Inner -->
    <rect x="55" y="85" width="190" height="140" rx="25" fill="#0F172A"/>
    <!-- Eyes -->
    <circle cx="105" cy="140" r="22" fill="#84CC16"/>
    <circle cx="195" cy="140" r="22" fill="#84CC16"/>
    <circle cx="100" cy="135" r="7" fill="#FFFFFF"/>
    <circle cx="190" cy="135" r="7" fill="#FFFFFF"/>
    <!-- Smile Line -->
    <path d="M 115 185 Q 150 205 185 185" stroke="#84CC16" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Ears -->
    <rect x="10" y="125" width="20" height="60" rx="10" fill="#FFFFFF"/>
    <rect x="270" y="125" width="20" height="60" rx="10" fill="#FFFFFF"/>
  </g>
</svg>
